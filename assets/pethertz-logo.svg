<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Horizontal Banner -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#070A0F" />
    </linearGradient>

    <!-- Electric Cyan to Neon Indigo Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Text Gradient for "Hertz" -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <radialGradient id="markGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0E131F" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Card -->
  <rect width="880" height="220" rx="36" fill="url(#bannerBg)" />
  <rect width="878" height="218" x="1" y="1" rx="35" fill="none" stroke="#1E293B" stroke-width="1" />

  <!-- Ambient Glow Behind Symbol -->
  <circle cx="120" cy="110" r="100" fill="url(#markGlow)" />

  <!-- ==================== LEFT: THE PETHERTZ MARK ==================== -->
  <g transform="translate(10, 0)">
    <!-- Concentric Bioacoustic Wave Rings -->
    <circle cx="110" cy="120" r="85" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="3 6" />

    <!-- TOE 1 (Far Left) -->
    <g transform="translate(56, 80) rotate(-34)">
      <rect x="-8" y="-18" width="16" height="36" rx="8" fill="url(#logoGrad)" />
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#0E131F" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- TOE 2 (Center Left) -->
    <g transform="translate(90, 56) rotate(-11)">
      <rect x="-9.5" y="-24" width="19" height="48" rx="9.5" fill="url(#logoGrad)" />
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#0E131F" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- TOE 3 (Center Right) -->
    <g transform="translate(132, 56) rotate(11)">
      <rect x="-9.5" y="-24" width="19" height="48" rx="9.5" fill="url(#logoGrad)" />
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#0E131F" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- TOE 4 (Far Right) -->
    <g transform="translate(166, 80) rotate(34)">
      <rect x="-8" y="-18" width="16" height="36" rx="8" fill="url(#logoGrad)" />
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#0E131F" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- MAIN PALM PAD -->
    <path d="M 111 96
             C 90 96, 68 107, 68 131
             C 68 153, 88 167, 101 172
             C 107 174, 115 174, 121 172
             C 134 167, 154 153, 154 131
             C 154 107, 132 96, 111 96 Z"
          fill="url(#logoGrad)" />

    <!-- Negative-Space Sine Hertz Wave -->
    <path d="M 78 134 
             C 86 134, 91 120, 98 120
             C 105 120, 107 148, 115 148
             C 121 148, 125 127, 130 127
             C 135 127, 139 134, 144 134"
          fill="none" 
          stroke="#0E131F" 
          stroke-width="4.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Bottom Pulse Indicator -->
    <path d="M 72 188 L 90 188 L 96 179 L 104 196 L 112 182 L 118 191 L 124 188 L 150 188" 
          fill="none" 
          stroke="#38BDF8" 
          stroke-width="1.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          stroke-opacity="0.6" />
  </g>

  <!-- ==================== RIGHT: TYPOGRAPHY ==================== -->
  <g transform="translate(230, 0)">
    <!-- Brand Name -->
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="76" font-weight="700" letter-spacing="-0.03em" fill="#F8FAFC">Pet<tspan fill="url(#textGrad)" font-weight="800">Hertz</tspan></text>

    <!-- Subtitle / Category Label -->
    <text x="3" y="160" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace" font-size="14.5" font-weight="600" letter-spacing="0.22em" fill="#94A3B8">BIOACOUSTIC AUDIO INTELLIGENCE</text>

    <!-- Decorative Frequency Scale Line -->
    <g transform="translate(3, 175)" opacity="0.4">
      <line x1="0" y1="0" x2="420" y2="0" stroke="#334155" stroke-width="1" />
      <line x1="0" y1="0" x2="0" y2="5" stroke="#22D3EE" stroke-width="1.5" />
      <line x1="105" y1="0" x2="105" y2="3" stroke="#475569" stroke-width="1" />
      <line x1="210" y1="0" x2="210" y2="5" stroke="#38BDF8" stroke-width="1.5" />
      <line x1="315" y1="0" x2="315" y2="3" stroke="#475569" stroke-width="1" />
      <line x1="420" y1="0" x2="420" y2="5" stroke="#818CF8" stroke-width="1.5" />
      <text x="0" y="16" font-family="monospace" font-size="9" fill="#64748B">20Hz</text>
      <text x="195" y="16" font-family="monospace" font-size="9" fill="#64748B">1kHz</text>
      <text x="395" y="16" font-family="monospace" font-size="9" fill="#64748B">20kHz</text>
    </g>
  </g>

</svg>

